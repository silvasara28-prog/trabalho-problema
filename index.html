<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ReparaAí: sistema para registrar e acompanhar os problemas de estrutura da escola.">
  <title>Entrar | ReparaAí</title>
  <link rel="stylesheet" href="index.css">
</head>
<body class="pagina-login">

  <main class="cartao">
    <div class="cartao-corpo">

      <header class="cabecalho-login">
        <h1>ReparaAí</h1>
        <p class="subtitulo">Entre para registrar ou acompanhar problemas</p>
      </header>

      <form class="formulario" id="form-login" action="relatar.html">

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="nome@escola.com" autocomplete="email" required>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" required>
        </div>

        <div class="campo">
          <label for="perfil">Perfil</label>
          <select id="perfil" required>
            <option value="funcionario">Professor ou funcionário</option>
            <option value="direcao">Direção</option>
            <option value="manutencao">Manutenção</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primario">Entrar</button>

      </form>

      <nav class="links-rodape" aria-label="Acesso sem login">
        <a href="publico.html">Ver problemas da escola</a>
        <a href="sugestões.html">Enviar uma sugestão (alunos)</a>
      </nav>

    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
